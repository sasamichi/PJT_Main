<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>世界交通網・地域データ基盤 (地図ビュー)</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/minimal.css">
</head>
<body style="overflow: hidden;">

  <!-- サイト共通ヘッダー -->
  <header class="site-header">
    <a href="index.html" class="brand-title">
      🌐 <span>世界交通網・地域データ基盤</span>
      <span class="brand-badge">LITE</span>
    </a>

    <nav class="header-nav">
      <a href="index.html" class="nav-tab-btn">📖 階層・一覧検索</a>
      <a href="map.html" class="nav-tab-btn active">🗺️ 地図ビュー</a>
    </nav>
  </header>

  <!-- 地図メインレイアウト -->
  <main class="map-layout">
    <div id="map"></div>

    <!-- 地図上部フィルターバー ＆ 階層ツリーに戻るボタン -->
    <div class="map-filter-bar">
      <a href="index.html" class="nav-tab-btn" style="font-size: 11px; padding: 4px 10px; background: #1e3a8a; color: #fff; border-color: #1e3a8a;">◀ 階層ビューに戻る</a>
      <label class="filter-chip">
        <input type="checkbox" data-filter="airSea" checked>
        <span>✈️ 空港・港湾</span>
      </label>
      <label class="filter-chip">
        <input type="checkbox" data-filter="shinkansen" checked>
        <span>🚄 新幹線・主要駅</span>
      </label>
      <label class="filter-chip">
        <input type="checkbox" data-filter="railways" checked>
        <span>🚆 一般鉄道駅</span>
      </label>
      <label class="filter-chip">
        <input type="checkbox" data-filter="roads" checked>
        <span>🛣️ IC・道の駅</span>
      </label>
      <label class="filter-chip">
        <input type="checkbox" data-filter="weather">
        <span>🌡️ 気象観測点</span>
      </label>
    </div>

    <!-- 地図下部情報バー -->
    <div class="map-info-bar">
      <span id="map-marker-count">読み込み中...</span>
    </div>
  </main>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <!-- データとスクリプト（CORSフリー・ローカル起動可能） -->
  <script src="js/data.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
