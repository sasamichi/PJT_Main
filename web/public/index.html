<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>世界交通網・地域データ基盤 (Global Transit & Territory Archive)</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- サイトヘッダー -->
  <header class="site-header">
    <div class="brand-area">
      <a href="index.html" class="brand-title">
        🌐 世界交通網・地域データ基盤
        <span class="brand-badge">PUBLIC</span>
      </a>
      <span class="brand-subtitle">Global Transit & Territory Archive</span>
    </div>

    <div class="header-controls">
      <span class="stats-summary-pill" id="stats-pill">データを読み込み中...</span>
      <button class="btn-icon" id="theme-toggle-btn" title="黒/白テーマ切替">🌙 黒背景</button>
      <a href="/?theme=light" class="btn-icon" title="管理者用: 机上探索 Web GIS へ" target="_blank" rel="noopener">
        🗺️ 机上探索 GIS
      </a>
      <a href="http://localhost:8501" class="btn-icon" title="管理者用: データ管理画面へ" target="_blank" rel="noopener">
        📊 データ管理
      </a>
    </div>
  </header>

  <!-- 国・地域セレクターバー -->
  <nav class="country-bar" id="country-selector-container">
    <!-- JSにより主要国ピルが動的描画されます -->
    <div style="font-size: 13px; color: var(--text-muted);">国リストを読み込み中...</div>
  </nav>

  <!-- メインコンテンツ（左右2カラム） -->
  <main class="main-layout">
    
    <!-- 左ペイン：データ & 検索 & シーケンス -->
    <section class="data-panel">
      
      <!-- 検索バー -->
      <div class="search-filter-box">
        <div class="search-input-wrapper">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-input" class="search-input" placeholder="路線名・駅名・自治体名・事業者名を検索...">
          <button id="search-clear-btn" class="search-clear-btn" title="クリア">✕</button>
        </div>
      </div>

      <!-- 3大データタブバー -->
      <div class="tabs-bar">
        <button class="tab-btn active" data-tab="routes">
          🚆 路線・交通
          <span class="tab-count-badge" id="tab-count-routes">0</span>
        </button>
        <button class="tab-btn" data-tab="muni">
          🏛️ 行政区画・自治体
          <span class="tab-count-badge" id="tab-count-muni">0</span>
        </button>
        <button class="tab-btn" data-tab="nodes">
          📍 交通拠点 (駅・IC等)
          <span class="tab-count-badge" id="tab-count-nodes">0</span>
        </button>
      </div>

      <!-- タブコンテンツ一覧表示エリア -->
      <div class="tab-content-container" id="tab-content">
        <div class="loading-box">
          <div class="spinner"></div>
          <div>データを読み込んでいます...</div>
        </div>
      </div>

    </section>

    <!-- 右ペイン：連動地図 -->
    <section class="map-panel">
      <div id="map"></div>
      <div class="map-overlay-info">
        <span id="map-marker-count">拠点を読み込み中</span>
        <button class="map-reset-btn" id="map-reset-btn" title="国の全体表示に戻す">全体表示に戻す</button>
      </div>
    </section>

  </main>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <!-- Custom Scripts -->
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
