<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>机上探索 MAP v2 - 世界交通網・地域データ基盤</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ========================================================== -->
  <!-- 上部ヘッダー & ツールバー (机上探索 MAP v2 UI) -->
  <!-- ========================================================== -->
  <header>
    <!-- 上段: ブランド、ステータス、分割切替、主要アクション -->
    <div class="header-top">
      <div class="brand-section">
        <div class="brand-title">
          <span>🌐 机上探索</span>
          <span class="badge-v2">MAP v2</span>
        </div>
        <div class="counter-badges">
          <div class="counter-badge" id="badge-points">0 ポイント</div>
          <div class="counter-badge" id="badge-routes">0 ルート</div>
          <div class="counter-badge" id="badge-screens">2 地図画面</div>
        </div>
      </div>

      <!-- 分割切り替えボタングループ -->
      <div class="split-controls">
        <button class="split-btn" data-layout="single">🔲 全画面</button>
        <button class="split-btn active" data-layout="split-h">◫ 2画面 (左右)</button>
        <button class="split-btn" data-layout="split-v">⊟ 2画面 (上下)</button>
        <button class="split-btn" data-layout="triple">||| 3画面</button>
        <button class="split-btn" data-layout="quad">⊞ 4画面</button>
      </div>

      <!-- ヘッダー右側 -->
      <div class="header-actions">
        <button class="btn-icon" id="btn-toggle-theme" title="背景色切り替え (黒/白)">🌙 黒背景</button>
        <a href="http://localhost:8501" target="_blank" class="btn-icon" title="データ管理・品質保証ツールを開く" style="text-decoration:none;">📊 データ管理へ</a>
        <button class="btn-primary" id="btn-toggle-record">📝 記録表示</button>
      </div>
    </div>

    <!-- 下段: ツール選択 ＆ 表示レイヤー切り替え -->
    <div class="header-bottom">
      <div class="tools-group">
        <span class="tool-label">ツール:</span>
        <button class="tool-btn active" data-tool="view">👁️ 閲覧・移動</button>
        <button class="tool-btn" data-tool="point">📍 ポイント</button>
        <button class="tool-btn" data-tool="route">〰️ ルート</button>
        <button class="tool-btn" data-tool="coord">🎯 座標</button>
        <button class="tool-btn" data-tool="other-map">🗺️ 他の地図へ</button>
      </div>

      <div class="layers-group">
        <label class="layer-toggle">
          <input type="checkbox" id="toggle-layer-points" checked>
          <span>ポイント (交通拠点)</span>
        </label>
        <label class="layer-toggle">
          <input type="checkbox" id="toggle-layer-routes" checked>
          <span>ルート (交通網)</span>
        </label>
        <label class="layer-toggle">
          <input type="checkbox" id="toggle-layer-wiki">
          <span>Wikidata (史跡・施設)</span>
        </label>
      </div>
    </div>
  </header>

  <!-- ========================================================== -->
  <!-- メインコンテンツ（全画面地図グリッド ＆ スライド記録パネル） -->
  <!-- ========================================================== -->
  <div class="main-viewport">
    
    <!-- 地図グリッドエリア -->
    <div id="map-grid" class="layout-split-h">
      
      <!-- ペイン 1 -->
      <div class="map-pane" id="pane-1">
        <div class="pane-floating-header">
          <div class="pane-search-box">
            <input type="text" id="input-search-1" placeholder="地名、住所、歴史スポットを検索">
            <button id="btn-search-1">検索</button>
          </div>
          <select class="pane-tile-select" id="select-tile-1"></select>
        </div>
        <div class="map-container" id="map-1"></div>
        <div class="pane-badge">Pane 1</div>
      </div>

      <!-- ペイン 2 -->
      <div class="map-pane" id="pane-2">
        <div class="pane-floating-header">
          <div class="pane-search-box">
            <input type="text" id="input-search-2" placeholder="地名、住所、歴史スポットを検索">
            <button id="btn-search-2">検索</button>
          </div>
          <select class="pane-tile-select" id="select-tile-2"></select>
        </div>
        <div class="map-container" id="map-2"></div>
        <div class="pane-badge">Pane 2</div>
      </div>

      <!-- ペイン 3 (3画面/4画面用) -->
      <div class="map-pane" id="pane-3" style="display:none;">
        <div class="pane-floating-header">
          <div class="pane-search-box">
            <input type="text" id="input-search-3" placeholder="地名、住所、歴史スポットを検索">
            <button id="btn-search-3">検索</button>
          </div>
          <select class="pane-tile-select" id="select-tile-3"></select>
        </div>
        <div class="map-container" id="map-3"></div>
        <div class="pane-badge">Pane 3</div>
      </div>

      <!-- ペイン 4 (4画面用) -->
      <div class="map-pane" id="pane-4" style="display:none;">
        <div class="pane-floating-header">
          <div class="pane-search-box">
            <input type="text" id="input-search-4" placeholder="地名、住所、歴史スポットを検索">
            <button id="btn-search-4">検索</button>
          </div>
          <select class="pane-tile-select" id="select-tile-4"></select>
        </div>
        <div class="map-container" id="map-4"></div>
        <div class="pane-badge">Pane 4</div>
      </div>

    </div>

    <!-- 右側スライドイン「記録パネル」 -->
    <div id="record-panel">
      <div class="panel-header">
        <div class="panel-title">📝 探索ログ記録ワークスペース</div>
        <button id="btn-close-record" style="background:none; border:none; color:var(--text-sub); cursor:pointer; font-size:16px;">✕</button>
      </div>

      <div class="panel-tabs">
        <button class="panel-tab active" data-target="tab-input">記録入力</button>
        <button class="panel-tab" data-target="tab-sns">SNS / note 下書き</button>
        <button class="panel-tab" data-target="tab-logs">蓄積ログ一覧</button>
      </div>

      <!-- タブ1: 記録入力フォーム -->
      <div class="panel-body tab-content" id="tab-input">
        <form id="exploration-form">
          <div class="form-group">
            <label>対象国</label>
            <select class="form-control" id="log-country">
              <option value="JP" selected>JP (日本)</option>
              <option value="AT">AT (オーストリア)</option>
            </select>
          </div>

          <div class="form-group">
            <label>ログのタイトル *</label>
            <input type="text" class="form-control" id="log-title" placeholder="例: 函館駅〜五稜郭・道南交通の起点と史跡" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>対象路線</label>
              <select class="form-control" id="log-route">
                <option value="">(未選択)</option>
              </select>
            </div>
            <div class="form-group">
              <label>対象拠点</label>
              <select class="form-control" id="log-node">
                <option value="">(未選択)</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label>対象自治体</label>
            <select class="form-control" id="log-municipality">
              <option value="">(未選択)</option>
            </select>
          </div>

          <div class="form-group">
            <label>代表座標 (緯度, 経度) <span class="coord-indicator" id="coord-display">地図クリックで自動取得</span></label>
            <input type="text" class="form-control" id="log-coords" placeholder="地図上をクリックすると自動入力されます">
          </div>

          <div class="form-group">
            <label>タグ (カンマ区切り)</label>
            <input type="text" class="form-control" id="log-tags" value="ルート変遷, 中世史跡, 旧街道">
          </div>

          <div class="form-group">
            <label>本文メモ (自由記述)</label>
            <textarea class="form-control" id="log-memo" placeholder="沿線の風景、旧道・廃止路線の痕跡、中世の館跡や史跡、地域の気候感などを自由に記録"></textarea>
          </div>

          <div class="form-group">
            <label>参考Webリンク</label>
            <input type="url" class="form-control" id="log-url" placeholder="https://ja.wikipedia.org/...">
          </div>

          <button type="submit" class="btn-primary" style="width:100%; justify-content:center; padding:8px; margin-top:8px;">
            探索ログをCSVに保存 (暗転なし)
          </button>
        </form>
      </div>

      <!-- タブ2: SNS / note 下書き -->
      <div class="panel-body tab-content" id="tab-sns" style="display:none;">
        <div class="form-group">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
            <label>X (旧Twitter) 用ポスト</label>
            <button class="btn-icon" id="btn-copy-x" style="padding:2px 8px; font-size:11px;">コピー</button>
          </div>
          <textarea class="form-control" id="draft-x" rows="4"></textarea>
        </div>

        <div class="form-group" style="margin-top:12px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
            <label>note 旅行記用下書き (Markdown)</label>
            <button class="btn-icon" id="btn-copy-note" style="padding:2px 8px; font-size:11px;">コピー</button>
          </div>
          <textarea class="form-control" id="draft-note" rows="8"></textarea>
        </div>
      </div>

      <!-- タブ3: 過去ログ一覧 -->
      <div class="panel-body tab-content" id="tab-logs" style="display:none;">
        <div id="logs-list-container"></div>
      </div>

    </div>

  </div>

  <!-- トースト通知 -->
  <div id="toast">メッセージ</div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <!-- Custom JS Modules -->
  <script src="js/tiles.js"></script>
  <script src="js/api.js"></script>
  <script src="js/records.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
