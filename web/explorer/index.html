<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>机上探索 MAP v2 - 世界交通網・地域データ基盤</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== 上部ヘッダー ===== -->
  <header>
    <div class="header-top">
      <div class="brand-section">
        <div class="brand-title"><span>🌐 机上探索</span><span class="badge-v2">MAP v2</span></div>
        <div class="counter-badges">
          <div class="counter-badge" id="badge-points">0 ポイント</div>
          <div class="counter-badge" id="badge-routes">0 ルート</div>
          <div class="counter-badge" id="badge-nodes">周辺拠点 0</div>
          <div class="counter-badge" id="badge-wiki">Wikidata -</div>
          <div class="counter-badge" id="badge-screens">2 地図画面</div>
        </div>
      </div>

      <div class="split-controls">
        <button class="split-btn" data-layout="single">🔲 1画面</button>
        <button class="split-btn active" data-layout="split-h">◫ 2画面 (左右)</button>
        <button class="split-btn" data-layout="split-v">⊟ 2画面 (上下)</button>
        <button class="split-btn" data-layout="quad">⊞ 4画面</button>
      </div>

      <div class="header-actions">
        <button class="btn-icon" id="btn-toggle-theme" title="背景色切り替え (黒/白)">🌙 黒背景</button>
        <a href="/public/" target="_blank" class="btn-icon" id="link-public" title="一般公開用Webサイト（プロトタイプ）を開く">🌐 公開サイト</a>
        <a href="http://localhost:8501/" target="_blank" class="btn-icon" id="link-admin" title="データ管理・品質保証ツールを開く">📊 データ管理へ</a>
        <button class="btn-primary" id="btn-toggle-record">📝 記録表示</button>
      </div>
    </div>

    <div class="header-bottom">
      <div class="tools-group">
        <span class="tool-label">ツール:</span>
        <button class="tool-btn active" data-tool="view" title="地図の移動・拡大のみ">👁️ 閲覧・移動</button>
        <button class="tool-btn" data-tool="point" title="クリックでポイントを追加">📍 ポイント</button>
        <button class="tool-btn" data-tool="route" title="クリックで頂点を追加、ダブルクリックで確定、頂点の右クリックで削除">〰️ ルート</button>
        <button class="tool-btn" data-tool="coord" title="クリックした座標をコピー">🎯 座標</button>
        <button class="tool-btn" id="btn-other-map" title="現在位置をGoogleマップで開く">🗺️ 他の地図へ</button>
      </div>

      <div class="layers-group">
        <label class="layer-toggle"><input type="checkbox" id="toggle-layer-nodes" checked><span class="legend-dot" style="background:#2563eb"></span><span>登録拠点</span></label>
        <label class="layer-toggle"><input type="checkbox" id="toggle-layer-mine" checked><span class="legend-dot" style="background:#f97316"></span><span>追加データ</span></label>
        <label class="layer-toggle"><input type="checkbox" id="toggle-layer-wiki" checked><span class="legend-dot" style="background:#a855f7"></span><span>Wikidata</span></label>
      </div>
    </div>
  </header>

  <!-- ===== 地図グリッド ＋ 記録パネル ===== -->
  <div class="main-viewport">
    <div id="map-grid" class="layout-split-h"></div>

    <div id="record-panel">
      <div class="panel-header">
        <div class="panel-title">📝 探索ログ記録</div>
        <button id="btn-close-record" class="btn-close" title="閉じる">✕</button>
      </div>

      <div class="panel-tabs">
        <button class="panel-tab active" data-target="tab-input">記録入力</button>
        <button class="panel-tab" data-target="tab-sns">SNS / note 下書き</button>
        <button class="panel-tab" data-target="tab-logs">蓄積ログ一覧</button>
      </div>

      <!-- 記録入力 -->
      <div class="panel-body tab-content" id="tab-input">
        <form id="exploration-form">
          <div class="edit-banner" id="edit-banner" hidden>
            <span id="edit-banner-text"></span>
            <button type="button" class="btn-link" id="btn-cancel-edit">編集をやめる</button>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>記録種別</label>
              <select class="form-control" id="log-type">
                <option value="ポイント">📍 ポイント</option>
                <option value="ルート">〰️ ルート</option>
              </select>
            </div>
            <div class="form-group">
              <label>対象国</label>
              <select class="form-control" id="log-country">
                <option value="JP" selected>JP (日本)</option>
                <option value="AT">AT (オーストリア)</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label>ログのタイトル *</label>
            <input type="text" class="form-control" id="log-title" placeholder="例: 函館駅〜五稜郭・道南交通の起点と史跡" required>
          </div>

          <div class="form-group" id="field-point">
            <label>代表座標 (緯度, 経度) <span class="coord-indicator">地図クリック / ピンのドラッグで更新</span></label>
            <input type="text" class="form-control" id="log-coords" placeholder="ポイントツールで地図をクリック">
          </div>

          <div class="form-group" id="field-route" hidden>
            <label>ルート <span class="coord-indicator" id="route-summary">頂点 0 / 0.0 km</span></label>
            <div class="inline-actions">
              <button type="button" class="btn-icon" id="btn-route-undo">↩ 最後の点を取消</button>
              <button type="button" class="btn-icon" id="btn-route-clear">🧹 ルートをクリア</button>
            </div>
            <span class="hint">ルートツールで連続クリック → ダブルクリックで確定。頂点はドラッグで移動、右クリックで削除。</span>
          </div>

          <div class="form-group">
            <label>対象路線</label>
            <div class="chips" id="chips-route"></div>
            <input type="text" class="form-control" id="log-route" list="dl-route" placeholder="路線名を入力して選択（複数可）" autocomplete="off">
            <datalist id="dl-route"></datalist>
          </div>

          <div class="form-group">
            <label>対象拠点 <span class="coord-indicator">表示中の地図周辺から選択</span></label>
            <div class="chips" id="chips-node"></div>
            <input type="text" class="form-control" id="log-node" list="dl-node" placeholder="拠点名を入力して選択（複数可）" autocomplete="off">
            <datalist id="dl-node"></datalist>
          </div>

          <div class="form-group">
            <label>対象自治体</label>
            <div class="chips" id="chips-municipality"></div>
            <input type="text" class="form-control" id="log-municipality" list="dl-municipality" placeholder="自治体名を入力して選択（複数可）" autocomplete="off">
            <datalist id="dl-municipality"></datalist>
          </div>

          <div class="form-group">
            <label>タグ (カンマ区切り)</label>
            <input type="text" class="form-control" id="log-tags" value="ルート変遷, 中世史跡, 旧街道">
          </div>

          <div class="form-group">
            <label>本文メモ (自由記述)</label>
            <textarea class="form-control" id="log-memo" placeholder="沿線の風景、旧道・廃止路線の痕跡、中世の館跡や史跡、地域の気候感などを自由に記録"></textarea>
          </div>

          <div class="form-group">
            <label>参考Webリンク</label>
            <input type="url" class="form-control" id="log-url" placeholder="https://ja.wikipedia.org/...">
          </div>

          <button type="submit" class="btn-primary btn-wide" id="btn-submit-log">探索ログを保存</button>
        </form>
      </div>

      <!-- SNS / note 下書き -->
      <div class="panel-body tab-content" id="tab-sns" hidden>
        <div class="form-group">
          <div class="label-row"><label>X (旧Twitter) 用ポスト</label><button class="btn-icon btn-small" id="btn-copy-x">コピー</button></div>
          <textarea class="form-control" id="draft-x" rows="4"></textarea>
        </div>
        <div class="form-group">
          <div class="label-row"><label>note 旅行記用下書き (Markdown)</label><button class="btn-icon btn-small" id="btn-copy-note">コピー</button></div>
          <textarea class="form-control" id="draft-note" rows="8"></textarea>
        </div>
      </div>

      <!-- 蓄積ログ一覧 -->
      <div class="panel-body tab-content" id="tab-logs" hidden>
        <div id="logs-list-container"></div>
      </div>
    </div>
  </div>

  <div id="toast">メッセージ</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/tiles.js"></script>
  <script src="js/api.js"></script>
  <script src="js/records.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
