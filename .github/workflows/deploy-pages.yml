name: Deploy Web Site to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'web/public/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: GitHub Pagesの設定初期化
        uses: actions/configure-pages@v5

      - name: 公開ディレクトリ(web/public)のアーティファクト作成
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web/public'

      - name: GitHub Pagesへのデプロイ実行
        id: deployment
        uses: actions/deploy-pages@v4
